<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>မြန်မာ အောကား</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#222;--muted:#777;--accent:#2f6fed;--border:#e3e3e0}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--card:#212124;--text:#eee;--muted:#999;--accent:#6b9bff;--border:#333}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Myanmar","Padauk",system-ui,sans-serif;line-height:1.8}
header{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
nav{display:flex;justify-content:space-between;align-items:center;height:60px}
nav a{color:var(--text);text-decoration:none;font-weight:700;font-size:20px;cursor:pointer}
button,.btn{background:var(--accent);color:#fff;border:0;padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.danger{background:#d64545}
main{padding:24px 0 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card h2{margin:0 0 6px;font-size:20px}
.meta{color:var(--muted);font-size:13px}
.excerpt{margin:8px 0 0;color:var(--muted)}
article h1{margin:0 0 6px}
.content{white-space:pre-wrap;margin-top:20px;font-size:17px}
input,textarea{width:100%;padding:10px;margin:6px 0 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
textarea{min-height:260px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.msg{text-align:center;color:var(--muted);padding:40px 0}
#search{margin-bottom:20px}
.cover{width:100%;max-height:360px;object-fit:cover;border-radius:10px;margin:14px 0;display:block}
.card .cover{max-height:180px;margin:0 0 12px}
</style>
</head>
<body>
<header><div class="wrap"><nav>
  <a onclick="go('')">မြန်မာ အောကား</a>
</nav></div></header>
<main class="wrap" id="app"></main>

<script>
// ===== ဒီမှာ Apps Script Web App URL ထည့်ပါ =====
const API_URL = 'https://script.google.com/macros/s/AKfycbyTx7u7CW5Y0ABJz7C-xcHjXmJrLeFdDt_ZWVIxvKIk69LghyzPsjURsZewbpnVaeqE/exec';
// ============================================

const app = document.getElementById('app');
let posts = [];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
const go = h => { location.hash = h; };

async function loadPosts() {
  const res = await fetch(API_URL);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error);
  posts = data.posts;
}

function renderList(filter = '') {
  const q = filter.toLowerCase();
  const list = posts.filter(p => (p.title + p.content).toLowerCase().includes(q));
  app.innerHTML = `<input id="search" placeholder="🔍 ရှာမယ်..." value="${esc(filter)}">` +
    (list.length ? list.map(p => `
      <div class="card" onclick="go('post/${p.id}')">
        ${p.image ? `<img class="cover" src="${esc(p.image)}" loading="lazy" alt="">` : ''}
        <h2>${esc(p.title)}</h2>
        <div class="meta">${esc(p.author)} · ${fmt(p.date)}</div>
        <p class="excerpt">${esc(p.content.slice(0, 140))}${p.content.length > 140 ? '...' : ''}</p>
      </div>`).join('') : '<div class="msg">Post မရှိသေးပါ</div>');
  const s = document.getElementById('search');
  s.oninput = e => { renderList(e.target.value); const n = document.getElementById('search'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
}

function renderPost(id) {
  const p = posts.find(x => x.id === id);
  if (!p) { app.innerHTML = '<div class="msg">ရှာမတွေ့ပါ</div>'; return; }
  app.innerHTML = `<article>
    <button class="ghost" onclick="go('')">← နောက်သို့</button>
    <h1 style="margin-top:16px">${esc(p.title)}</h1>
    <div class="meta">${esc(p.author)} · ${fmt(p.date)}</div>
    ${p.image ? `<img class="cover" src="${esc(p.image)}" alt="">` : ''}
    <div class="content">${esc(p.content)}</div></article>`;
}

async function route() {
  const [page, id] = location.hash.slice(1).split('/');
  if (page === 'post') renderPost(id);
  else renderList();
  window.scrollTo(0, 0);
}

(async () => {
  if (API_URL.startsWith('PASTE')) { app.innerHTML = '<div class="msg">index.html ထဲက API_URL ကို ထည့်ပါ</div>'; return; }
  app.innerHTML = '<div class="msg">Loading...</div>';
  try { await loadPosts(); } catch (e) { app.innerHTML = `<div class="msg">Error: ${esc(e.message)}</div>`; return; }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
