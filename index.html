<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>မြန်မာ အောကား</title></title>
<style>
:root{--bg:#0a0b10;--card:#12141d;--card2:#181b27;--text:#e8eaf2;--muted:#8b90a7;--a1:#7c5cff;--a2:#00e5ff;--border:#242838}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--text);font-family:"Noto Sans Myanmar","Padauk",system-ui,sans-serif;line-height:1.85;
  background:radial-gradient(900px 500px at 85% -10%,rgba(124,92,255,.18),transparent 60%),radial-gradient(700px 400px at -5% 10%,rgba(0,229,255,.10),transparent 60%),var(--bg);
  background-attachment:fixed;min-height:100vh}
::selection{background:var(--a1);color:#fff}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:rgba(10,11,16,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
nav{display:flex;justify-content:space-between;align-items:center;height:64px}
nav a{font-weight:800;font-size:22px;letter-spacing:.5px;cursor:pointer;text-decoration:none;
  background:linear-gradient(90deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
main{padding:28px 0 70px}
button{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border:0;padding:9px 18px;border-radius:10px;cursor:pointer;font:inherit;font-size:14px;font-weight:600;transition:box-shadow .2s,transform .2s}
button:hover{box-shadow:0 0 18px rgba(0,229,255,.45);transform:translateY(-1px)}
button.ghost{background:transparent;color:var(--a2);border:1px solid var(--a2)}
button.ghost:hover{background:rgba(0,229,255,.1)}
#search,input{width:100%;padding:13px 16px;margin-bottom:22px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font:inherit;outline:0;transition:border .2s,box-shadow .2s}
#search:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(124,92,255,.25)}
#search::placeholder{color:var(--muted)}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--a2),var(--a1));opacity:.7}
.card:hover{transform:translateY(-4px);border-color:var(--a1);box-shadow:0 10px 34px rgba(124,92,255,.25)}
.card h2{margin:0 0 6px;font-size:21px;color:#fff;transition:color .2s}
.card:hover h2{color:var(--a2)}
.meta{color:var(--a2);font-size:13px;opacity:.85}
.meta::before{content:"● ";color:var(--a1);font-size:10px}
.excerpt{margin:10px 0 0;color:var(--muted)}
.cover{width:100%;max-height:380px;object-fit:cover;border-radius:12px;margin:16px 0;display:block;border:1px solid var(--border)}
.card .cover{max-height:190px;margin:0 0 14px;transition:transform .3s}
.card:hover .cover{transform:scale(1.02)}
article h1{margin:0 0 8px;font-size:32px;line-height:1.4;background:linear-gradient(90deg,#fff,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.content{white-space:pre-wrap;margin-top:22px;font-size:17px;color:#cfd3e4}
.msg{text-align:center;color:var(--muted);padding:60px 0}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
</style>
</head>
<body>
<header><div class="wrap"><nav>
  <a onclick="go('')">မြန်မာ အောကား</a>
</nav></div></header>
<main class="wrap" id="app"></main>

<script>
// ===== ဒီမှာ Apps Script Web App URL ထည့်ပါ =====
const API_URL = 'https://script.google.com/macros/s/AKfycbyTx7u7CW5Y0ABJz7C-xcHjXmJrLeFdDt_ZWVIxvKIk69LghyzPsjURsZewbpnVaeqE/exec';
// ============================================

const app = document.getElementById('app');
let posts = [];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
const go = h => { location.hash = h; };

async function loadPosts() {
  const res = await fetch(API_URL);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error);
  posts = data.posts;
}

function renderList(filter = '') {
  const q = filter.toLowerCase();
  const list = posts.filter(p => (p.title + p.content).toLowerCase().includes(q));
  app.innerHTML = `<input id="search" placeholder="🔍 ရှာမယ်..." value="${esc(filter)}">` +
    (list.length ? list.map(p => `
      <div class="card" onclick="go('post/${p.id}')">
        ${p.image ? `<img class="cover" src="${esc(p.image)}" loading="lazy" alt="">` : ''}
        <h2>${esc(p.title)}</h2>
        <div class="meta">${esc(p.author)} · ${fmt(p.date)}</div>
        <p class="excerpt">${esc(p.content.slice(0, 140))}${p.content.length > 140 ? '...' : ''}</p>
      </div>`).join('') : '<div class="msg">Post မရှိသေးပါ</div>');
  const s = document.getElementById('search');
  s.oninput = e => { renderList(e.target.value); const n = document.getElementById('search'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
}

function renderPost(id) {
  const p = posts.find(x => x.id === id);
  if (!p) { app.innerHTML = '<div class="msg">ရှာမတွေ့ပါ</div>'; return; }
  app.innerHTML = `<article>
    <button class="ghost" onclick="go('')">← နောက်သို့</button>
    <h1 style="margin-top:16px">${esc(p.title)}</h1>
    <div class="meta">${esc(p.author)} · ${fmt(p.date)}</div>
    ${p.image ? `<img class="cover" src="${esc(p.image)}" alt="">` : ''}
    <div class="content">${esc(p.content)}</div></article>`;
}

async function route() {
  const [page, id] = location.hash.slice(1).split('/');
  if (page === 'post') renderPost(id);
  else renderList();
  window.scrollTo(0, 0);
}

(async () => {
  if (API_URL.startsWith('PASTE')) { app.innerHTML = '<div class="msg">index.html ထဲက API_URL ကို ထည့်ပါ</div>'; return; }
  app.innerHTML = '<div class="msg">Loading...</div>';
  try { await loadPosts(); } catch (e) { app.innerHTML = `<div class="msg">Error: ${esc(e.message)}</div>`; return; }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
