<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Blog</title>
<style>
/* =========================================================
   NEON BLOG — shared theme
   Palette: void #05060a, panel #0b0e16, line #1c2233,
            neon pink #ff2e97, neon cyan #26f6ff, neon lime #b6ff3c,
            text #eef1fb, muted #8a90a8
   Type: 'Space Grotesk' (display/UI) + 'Sora' (body)
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600&display=swap');

:root{
  --void:#05060a;
  --panel:#0b0e16;
  --panel-2:#0f1320;
  --line:#1c2233;
  --pink:#ff2e97;
  --cyan:#26f6ff;
  --lime:#b6ff3c;
  --text:#eef1fb;
  --muted:#8a90a8;
  --danger:#ff5468;
  --radius:14px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}

body{
  background:
    radial-gradient(1100px 600px at 12% -10%, rgba(255,46,151,.16), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(38,246,255,.14), transparent 55%),
    var(--void);
  color:var(--text);
  font-family:'Sora', sans-serif;
  line-height:1.6;
  min-height:100vh;
}

h1,h2,h3,.brand,.btn,.tab,label,.eyebrow-none{
  font-family:'Space Grotesk', sans-serif;
}

a{color:var(--cyan);text-decoration:none;}

::selection{background:var(--pink);color:var(--void);}

/* ---------- layout shell ---------- */
.wrap{
  max-width:920px;
  margin:0 auto;
  padding:0 20px 80px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 0 26px;
  border-bottom:1px solid var(--line);
  margin-bottom:36px;
  gap:16px;
  flex-wrap:wrap;
}

.brand{
  font-size:22px;
  font-weight:700;
  letter-spacing:.2px;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:10px;
}
.brand .dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--lime);
  box-shadow:0 0 10px var(--lime), 0 0 22px var(--lime);
}

.nav-links{display:flex;gap:18px;align-items:center;}
.nav-links a{
  color:var(--muted);
  font-size:14px;
  font-weight:600;
  transition:color .18s ease;
}
.nav-links a:hover{color:var(--cyan);}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  padding:11px 20px;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:border-color .18s ease, box-shadow .18s ease, transform .12s ease;
}
.btn:hover{border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan), 0 0 18px rgba(38,246,255,.35);}
.btn:active{transform:translateY(1px);}

.btn.primary{
  background:linear-gradient(135deg, rgba(255,46,151,.18), rgba(38,246,255,.14));
  border-color:var(--pink);
  box-shadow:0 0 18px rgba(255,46,151,.25);
}
.btn.primary:hover{box-shadow:0 0 0 1px var(--pink), 0 0 26px rgba(255,46,151,.45);}

.btn.danger{border-color:var(--danger); color:var(--danger);}
.btn.danger:hover{box-shadow:0 0 0 1px var(--danger), 0 0 18px rgba(255,84,104,.35);}

.btn.block{width:100%;}
.btn.small{padding:7px 14px;font-size:13px;}

/* ---------- cards ---------- */
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
}

.post-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:22px;
  transition:border-color .2s ease, box-shadow .2s ease;
}
.post-card:hover{
  border-color:var(--pink);
  box-shadow:0 0 24px rgba(255,46,151,.18);
}
.post-card img{
  width:100%;
  display:block;
  max-height:360px;
  object-fit:cover;
  border-bottom:1px solid var(--line);
}
.post-card .body{padding:20px 22px 22px;}
.post-card h2{
  margin:0 0 6px;
  font-size:21px;
  color:var(--text);
}
.post-card h2 a{color:inherit;}
.post-card h2 a:hover{color:var(--pink);}
.meta{
  font-size:12.5px;
  color:var(--muted);
  margin-bottom:12px;
}
.meta .sep{margin:0 8px;color:var(--line);}
.excerpt{color:#c4c9de;font-size:15px;}

.read-more{
  display:inline-block;
  margin-top:14px;
  font-weight:600;
  font-size:14px;
  color:var(--lime);
}
.read-more:hover{color:var(--pink);}

/* ---------- single post ---------- */
.post-full img{
  width:100%;
  border-radius:var(--radius);
  border:1px solid var(--line);
  max-height:480px;
  object-fit:cover;
  margin-bottom:24px;
}
.post-full h1{font-size:32px;margin:0 0 10px;}
.post-full .content{
  font-size:16.5px;
  color:#d6dae9;
  white-space:pre-wrap;
}

/* ---------- forms ---------- */
.field{margin-bottom:18px;}
.field label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--muted);
  margin-bottom:8px;
}
input[type=text], input[type=password], input[type=file], textarea{
  width:100%;
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--text);
  padding:12px 14px;
  border-radius:10px;
  font-family:'Sora',sans-serif;
  font-size:14.5px;
  outline:none;
  transition:border-color .18s ease, box-shadow .18s ease;
}
input:focus, textarea:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(38,246,255,.12);
}
textarea{min-height:160px; resize:vertical; line-height:1.6;}

.login-shell{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-card{max-width:380px; width:100%;}
.login-card h1{font-size:24px;margin:0 0 4px;}
.login-card p.sub{color:var(--muted);font-size:13.5px;margin:0 0 26px;}

/* ---------- admin ---------- */
.admin-shell{display:flex; min-height:100vh;}
.sidebar{
  width:230px;
  flex-shrink:0;
  border-right:1px solid var(--line);
  padding:26px 18px;
  background:var(--panel);
}
.sidebar .brand{margin-bottom:30px;}
.sidebar .tab{
  display:block;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
  padding:11px 14px;
  border-radius:9px;
  cursor:pointer;
  margin-bottom:6px;
  transition:background .15s ease, color .15s ease;
}
.sidebar .tab:hover{background:var(--panel-2); color:var(--text);}
.sidebar .tab.active{
  background:rgba(255,46,151,.12);
  color:var(--pink);
  box-shadow:inset 0 0 0 1px rgba(255,46,151,.35);
}
.admin-main{flex:1; padding:34px 40px; max-width:900px;}
.admin-main h1{font-size:24px; margin:0 0 24px;}

.upload-zone{
  border:1.5px dashed var(--line);
  border-radius:var(--radius);
  padding:26px;
  text-align:center;
  color:var(--muted);
  font-size:13.5px;
  margin-bottom:10px;
}
.preview-img{
  max-width:100%;
  max-height:220px;
  border-radius:10px;
  border:1px solid var(--line);
  margin-top:14px;
  display:none;
}

.directlink-box{
  display:flex;
  gap:8px;
  margin-top:14px;
}
.directlink-box input{flex:1;}

.admin-post-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:12px;
  margin-bottom:10px;
  background:var(--panel);
}
.admin-post-row img{
  width:56px;height:56px;object-fit:cover;border-radius:8px;
  border:1px solid var(--line);
  flex-shrink:0;
}
.admin-post-row .info{flex:1; min-width:0;}
.admin-post-row .info h3{margin:0 0 3px; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.admin-post-row .info span{font-size:12px; color:var(--muted);}
.admin-post-row .actions{display:flex; gap:8px; flex-shrink:0;}

.toast{
  position:fixed;
  bottom:26px; right:26px;
  background:var(--panel);
  border:1px solid var(--cyan);
  box-shadow:0 0 22px rgba(38,246,255,.3);
  padding:14px 20px;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  z-index:999;
  opacity:0;
  transform:translateY(10px);
  transition:opacity .25s ease, transform .25s ease;
  pointer-events:none;
}
.toast.show{opacity:1; transform:translateY(0);}
.toast.error{border-color:var(--danger); box-shadow:0 0 22px rgba(255,84,104,.3);}

.empty{
  text-align:center;
  color:var(--muted);
  padding:60px 20px;
  border:1px dashed var(--line);
  border-radius:var(--radius);
}

.spinner{
  width:18px;height:18px;
  border:2.5px solid var(--line);
  border-top-color:var(--pink);
  border-radius:50%;
  animation:spin .7s linear infinite;
  display:inline-block;
  vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg);}}

.hidden{display:none !important;}

@media(max-width:720px){
  .admin-shell{flex-direction:column;}
  .sidebar{width:100%; display:flex; overflow-x:auto; padding:14px; border-right:none; border-bottom:1px solid var(--line);}
  .sidebar .brand{display:none;}
  .sidebar .tab{white-space:nowrap; margin-bottom:0; margin-right:6px;}
  .admin-main{padding:24px 18px;}
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> Neon Blog</div>
    <div class="nav-links">
      <a href="user.html">Home</a>
      <a href="admin.html">Admin</a>
    </div>
  </div>

  <div id="postDetail" class="hidden"></div>
  <div id="postList"></div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   NEON BLOG — user side logic
   ========================================================= */

// ⚠️ PASTE your Google Apps Script Web App URL here after deploying Code.gs
const API_URL = 'https://script.google.com/macros/s/AKfycbxvsYqdu9fXpXOmALkLc5k3RvwmyK0HVVG2LWTS6XQCRVDCCUgblHbO6MPU3MtDJuSL8A/exec';

const postListEl = document.getElementById('postList');
const postDetailEl = document.getElementById('postDetail');

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function formatDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch (e) {
    return '';
  }
}

function excerpt(text, len = 160) {
  if (!text) return '';
  return text.length > len ? text.slice(0, len).trim() + '…' : text;
}

async function apiGet(params) {
  const url = `${API_URL}?${new URLSearchParams(params).toString()}`;
  const res = await fetch(url);
  return res.json();
}

/* -------- render post list -------- */
async function loadPosts() {
  postListEl.innerHTML = `<div class="empty"><span class="spinner"></span> Loading posts…</div>`;
  try {
    const data = await apiGet({ action: 'getPosts' });
    if (!data.success) throw new Error(data.error || 'Failed to load');

    if (!data.posts.length) {
      postListEl.innerHTML = `<div class="empty">No posts yet. Check back soon ✨</div>`;
      return;
    }

    postListEl.innerHTML = data.posts.map(p => `
      <div class="post-card">
        ${p.imageUrl ? `<img src="${escapeHtml(p.imageUrl)}" alt="${escapeHtml(p.title)}" loading="lazy">` : ''}
        <div class="body">
          <h2><a href="#" data-id="${escapeHtml(p.id)}" class="open-post">${escapeHtml(p.title)}</a></h2>
          <div class="meta">${escapeHtml(p.author || 'Admin')}<span class="sep">•</span>${formatDate(p.createdAt)}</div>
          <div class="excerpt">${escapeHtml(excerpt(p.content))}</div>
          <a href="#" data-id="${escapeHtml(p.id)}" class="read-more open-post">Read post →</a>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.open-post').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        openPost(el.dataset.id);
      });
    });
  } catch (err) {
    postListEl.innerHTML = `<div class="empty">Couldn't load posts.<br>${escapeHtml(err.message)}</div>`;
  }
}

/* -------- render single post -------- */
async function openPost(id) {
  postListEl.classList.add('hidden');
  postDetailEl.classList.remove('hidden');
  postDetailEl.innerHTML = `<div class="empty"><span class="spinner"></span> Loading…</div>`;

  try {
    const data = await apiGet({ action: 'getPost', id });
    if (!data.success) throw new Error(data.error || 'Post not found');
    const p = data.post;

    postDetailEl.innerHTML = `
      <a href="#" id="backLink" class="read-more">← Back to all posts</a>
      <div class="post-full" style="margin-top:18px;">
        ${p.imageUrl ? `<img src="${escapeHtml(p.imageUrl)}" alt="${escapeHtml(p.title)}">` : ''}
        <h1>${escapeHtml(p.title)}</h1>
        <div class="meta">${escapeHtml(p.author || 'Admin')}<span class="sep">•</span>${formatDate(p.createdAt)}</div>
        <div class="content">${escapeHtml(p.content)}</div>
      </div>
    `;
    document.getElementById('backLink').addEventListener('click', (e) => {
      e.preventDefault();
      postDetailEl.classList.add('hidden');
      postListEl.classList.remove('hidden');
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    postDetailEl.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
  }
}

loadPosts();

</script>

</body>
