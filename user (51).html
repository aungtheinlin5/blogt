<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0f08">
<title>တရားတော်များ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0f08;--bg2:#2a1710;--card:#3a2016;--saffron:#f28c28;--gold:#e8b84a;--cream:#fff4dc;--muted:#cdb08a;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans Myanmar","Padauk",system-ui,sans-serif;
  background:radial-gradient(circle at 50% -10%,rgba(232,184,74,.25),transparent 55%),linear-gradient(180deg,var(--bg2),var(--bg) 60%);
  background-attachment:fixed;color:var(--cream);min-height:100vh;line-height:1.7;overflow-x:hidden;padding-bottom:20px;transition:padding-bottom .3s}
body.has-player{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.ic{width:24px;height:24px;fill:currentColor;display:block;pointer-events:none}

.hero{position:relative;text-align:center;padding:20px 16px 8px}
.wheel{width:60px;height:60px;margin:0 auto 4px;animation:spin 40s linear infinite;filter:drop-shadow(0 0 10px rgba(232,184,74,.6))}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{font-size:1.45rem;color:var(--gold);text-shadow:0 2px 12px rgba(242,140,40,.4);line-height:1.5}
.hero p{color:var(--muted);font-size:.9rem}
.container{max-width:760px;margin:0 auto;padding:0 12px}

/* Slider */
.slider{position:relative;margin:10px 0 16px;border-radius:var(--radius);overflow:hidden;border:1px solid rgba(232,184,74,.35);box-shadow:0 6px 24px rgba(0,0,0,.45)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/9;background:linear-gradient(135deg,var(--card),#2d1810)}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,244,220,.5);transition:all .25s}
.dot.on{background:var(--gold);width:22px;border-radius:6px}

.sec{color:var(--gold);font-size:1.05rem;text-align:center;margin:6px 0 12px}

/* ဆရာတော် Grid */
.monks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.monk{cursor:pointer;text-align:center;background:linear-gradient(135deg,var(--card),#2d1810);border:1px solid rgba(232,184,74,.3);border-radius:14px;padding:6px 6px 9px;transition:transform .12s,border-color .15s;min-width:0}
.monk:active{transform:scale(.96)}
.monk:hover{border-color:var(--gold)}
.photo{aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:radial-gradient(circle,#5a3320,#2a1710);display:grid;place-items:center;font-size:2.2rem;color:var(--gold);border:1px solid rgba(232,184,74,.25)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.mname{font-size:.78rem;font-weight:700;color:var(--gold);line-height:1.45;margin-top:7px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.mtitle{font-size:.68rem;color:var(--muted);line-height:1.4;margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.mcount{display:inline-block;margin-top:4px;font-size:.66rem;padding:0 8px;border-radius:999px;background:rgba(232,184,74,.15);color:var(--gold)}

/* ဆရာတော်တစ်ပါး၏ တရားများ */
.back{display:inline-flex;align-items:center;gap:6px;margin:10px 0;padding:9px 16px;min-height:42px;border-radius:999px;border:1px solid rgba(232,184,74,.5);background:rgba(0,0,0,.3);color:var(--gold);font:inherit;font-size:.9rem;cursor:pointer}
.mhead{display:flex;align-items:center;gap:14px;padding:12px;margin-bottom:12px;background:linear-gradient(135deg,var(--card),#2d1810);border:1px solid rgba(232,184,74,.3);border-radius:var(--radius)}
.mhead .photo{width:74px;flex:0 0 74px}
.mhead .mn{font-size:1.1rem;font-weight:700;color:var(--gold);line-height:1.5}
.mhead .mt{font-size:.85rem;color:var(--muted)}

.search{width:100%;padding:12px 18px;border-radius:999px;border:1px solid rgba(232,184,74,.4);background:rgba(0,0,0,.35);color:var(--cream);font:inherit;font-size:16px;outline:none}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,184,74,.2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 16px;border-radius:999px;cursor:pointer;border:1px solid rgba(232,184,74,.4);background:transparent;color:var(--muted);font:inherit;font-size:.9rem}
.chip.active{background:linear-gradient(135deg,var(--saffron),var(--gold));color:#3a1a05;border-color:transparent;font-weight:600}

.list{display:flex;flex-direction:column;gap:9px}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;min-height:62px;background:linear-gradient(135deg,var(--card),#2d1810);border:1px solid rgba(232,184,74,.18);border-radius:var(--radius);cursor:pointer;transition:border-color .15s,transform .1s}
.item:active{transform:scale(.98)}
.item.playing{border-color:var(--saffron);box-shadow:0 0 16px rgba(242,140,40,.35)}
.num{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;font-size:1rem;background:radial-gradient(circle,var(--gold),var(--saffron));color:#3a1a05;font-weight:700}
.info{min-width:0;flex:1}
.t{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.5;word-break:break-word}
.tag{font-size:.72rem;padding:2px 9px;border-radius:999px;background:rgba(232,184,74,.15);color:var(--gold);white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.empty,.loading{text-align:center;color:var(--muted);padding:36px 10px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:22px 10px 8px}

/* ===== Mini Player (အောက်ချုံ့ထားချိန်) ===== */
.mini{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:50;display:none;align-items:center;gap:10px;
  padding:8px 8px 10px 10px;border-radius:18px;background:linear-gradient(135deg,#5a2a1a,#2a1710);border:1px solid var(--gold);
  box-shadow:0 6px 24px rgba(0,0,0,.6);cursor:pointer;overflow:hidden;max-width:744px;margin:0 auto}
.mini.show{display:flex}
.mini .th{width:46px;height:46px;flex:0 0 46px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#2a1710;border:2px solid var(--gold);color:var(--gold);font-size:1.4rem}
.mini .th img{width:100%;height:100%;object-fit:cover;object-position:center top}
.mini .mi{min-width:0;flex:1}
.mini .a{font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.mini .b{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.mbtn{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:none;background:none;color:var(--cream);display:grid;place-items:center;cursor:pointer}
.mbtn.pp{background:linear-gradient(135deg,var(--saffron),var(--gold));color:#3a1a05}
.mini .prog{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold)}

/* ===== Full Player ===== */
.fp{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#8a3416 0%,#5a1f10 30%,#2a1710 60%);
  transform:translateY(105%);visibility:hidden;transition:transform .35s ease,visibility 0s .35s}
.fp.show{transform:none;visibility:visible;transition:transform .35s ease,visibility 0s}
.fp-top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 0;flex:0 0 auto}
.round{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,244,220,.6);background:rgba(0,0,0,.2);color:var(--cream);display:grid;place-items:center;cursor:pointer}
.round:active{background:rgba(232,184,74,.3)}
.art{position:relative;z-index:2;flex:0 0 auto;display:grid;place-items:center;margin-top:-6px}
.art-box{width:min(52vw,210px);aspect-ratio:1;border-radius:28px;background:linear-gradient(135deg,#b24f1d,#6b2412);border:2px solid rgba(232,184,74,.85);display:grid;place-items:center;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.art-circle{width:82%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:4px solid #1a0f08;background:#2a1710;display:grid;place-items:center;font-size:3.6rem;color:var(--gold)}
.art-circle img{width:100%;height:100%;object-fit:cover;object-position:center top}
.sheet{position:relative;flex:1;min-height:0;overflow-y:auto;margin-top:-62px;padding:84px 20px calc(18px + env(safe-area-inset-bottom));background:#251813;border-radius:32px 32px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.35)}
.ttl{font-size:1.28rem;font-weight:700;text-align:center;line-height:1.6;color:#fff;word-break:break-word}
.spk{text-align:center;color:var(--muted);font-size:1rem;margin-top:2px;line-height:1.5}
.tools{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.tool{width:48px;height:48px;border-radius:50%;background:none;border:none;color:var(--cream);display:grid;place-items:center;position:relative;cursor:pointer;font:inherit}
.tool:active{background:rgba(232,184,74,.2)}
.tool.on{color:var(--gold)}
.tool .lbl{font-size:1rem;font-weight:600}
.tool .badge{position:absolute;bottom:1px;right:-2px;font-size:.62rem;color:var(--gold);font-weight:700}
.seekwrap{margin-top:10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;outline:none;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(to right,var(--gold) var(--p),rgba(255,255,255,.25) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6.5px;border-radius:50%;background:var(--gold);border:none;box-shadow:0 0 0 4px rgba(232,184,74,.25)}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:rgba(255,255,255,.25)}
input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:var(--gold)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:var(--gold)}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:0}
.main-ctrls{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:0 4px}
.mc{width:56px;height:56px;border-radius:50%;border:none;background:none;color:var(--cream);display:grid;place-items:center;cursor:pointer}
.mc:active{background:rgba(232,184,74,.2)}
.mc .ic{width:30px;height:30px}
.mc.play{width:74px;height:74px;background:linear-gradient(135deg,var(--saffron),var(--gold));color:#3a1a05;box-shadow:0 6px 20px rgba(242,140,40,.4)}
.mc.play .ic{width:38px;height:38px}
.hint{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);z-index:5;background:rgba(0,0,0,.75);color:var(--cream);padding:6px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.hint.show{opacity:1}
@media (max-height:640px){.art-box{width:min(40vw,150px)}.sheet{padding-top:70px}.tools{margin-top:12px}.mc.play{width:64px;height:64px}}

/* တရားစာရင်း (Queue) */
.qp{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
.qp.show{display:flex}
.qcard{width:100%;max-height:72vh;overflow-y:auto;background:#251813;border-radius:24px 24px 0 0;padding:0 14px calc(16px + env(safe-area-inset-bottom));border-top:2px solid var(--gold)}
.qh{position:sticky;top:0;background:#251813;display:flex;justify-content:space-between;align-items:center;padding:14px 4px 10px;color:var(--gold);font-weight:700}
.qi{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;cursor:pointer}
.qi.on{background:rgba(242,140,40,.18)}
.qi .qn{width:30px;flex:0 0 30px;text-align:center;color:var(--muted);font-size:.9rem}
.qi.on .qn{color:var(--saffron)}
.qi .qt{flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.5;word-break:break-word}

/* Account */
.acct{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(232,184,74,.6);background:rgba(0,0,0,.3);color:var(--gold);font-size:1.1rem;font-weight:700;cursor:pointer;font-family:inherit}
.acct.in{background:linear-gradient(135deg,var(--saffron),var(--gold));color:#3a1a05}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-120px);z-index:120;max-width:92vw;text-align:center;background:var(--saffron);color:#3a1a05;padding:10px 20px;border-radius:999px;font-weight:700;font-size:.9rem;transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.acbox{width:min(100%,400px);max-height:92vh;overflow-y:auto;background:linear-gradient(135deg,#3a2016,#2a1710);border:1px solid var(--gold);border-radius:20px;padding:16px 18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.ach{display:flex;justify-content:space-between;align-items:center;color:var(--gold);font-weight:700;font-size:1.1rem;margin-bottom:8px}
.acbox label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
.acbox input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(232,184,74,.4);background:rgba(0,0,0,.35);color:var(--cream);font:inherit;font-size:16px;outline:none}
.acbox input:focus{border-color:var(--gold)}
.abtn{width:100%;margin-top:16px;padding:12px;min-height:46px;border:none;border-radius:999px;background:linear-gradient(135deg,var(--saffron),var(--gold));color:#3a1a05;font:inherit;font-weight:700;cursor:pointer}
.abtn:disabled{opacity:.5}
.alinks{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:.88rem;flex-wrap:wrap}
.alinks button{background:none;border:none;color:var(--gold);font:inherit;text-decoration:underline;cursor:pointer;padding:4px 0}
.amsg{margin-top:10px;font-size:.88rem;color:#ffb089;min-height:1.2em;line-height:1.6}
.amsg.ok{color:#9be29b}
.acem{text-align:center;padding:14px 0;color:var(--cream);word-break:break-all}
/* Live */
.livecard{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 16px;padding:12px 14px;border-radius:var(--radius);border:1px solid rgba(232,184,74,.4);background:linear-gradient(135deg,#4a1d12,#2a1710);color:var(--cream);font:inherit;text-align:left;cursor:pointer}
.livecard:active{transform:scale(.98)}
.ldot{flex:0 0 14px;width:14px;height:14px;border-radius:50%;background:#7a6a5a}
.livecard.on .ldot{background:#e53935;box-shadow:0 0 0 0 rgba(229,57,53,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(229,57,53,0)}100%{box-shadow:0 0 0 0 rgba(229,57,53,0)}}
.livecard .lt{flex:1;min-width:0}
.livecard .l1{font-weight:700;color:var(--gold);line-height:1.5}
.livecard .l2{font-size:.82rem;color:var(--muted);line-height:1.5}
.livecard .lgo{color:var(--gold);font-size:1.2rem}
.acbox.livebox{width:min(100%,640px);text-align:center}
.livescreen{aspect-ratio:16/9;border-radius:14px;background:radial-gradient(circle,#5a3320,#1a0f08);border:1px solid rgba(232,184,74,.3);display:grid;place-items:center;color:var(--muted);margin:10px 0;overflow:hidden}
.livescreen iframe,.livescreen video{width:100%;height:100%;border:0;display:block}
.livescreen .ph{padding:12px;line-height:1.7}
.livescreen{position:relative}
.lvov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;background:rgba(0,0,0,.55);color:var(--cream);line-height:1.7}
.tapbtn{padding:12px 22px;min-height:46px;border:none;border-radius:999px;background:linear-gradient(135deg,var(--saffron),var(--gold));color:#3a1a05;font:inherit;font-weight:700;cursor:pointer}
.livescreen .ph b{display:block;font-size:2rem;margin-bottom:4px}
/* Bell / Share */
.bell{position:absolute;top:14px;right:64px;width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(232,184,74,.6);background:rgba(0,0,0,.3);color:var(--gold);display:grid;place-items:center;cursor:pointer}
.bell .bdg{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#d32f2f;color:#fff;font-size:.72rem;font-weight:700;line-height:19px;text-align:center;display:none}
.bell.lit{background:linear-gradient(135deg,var(--saffron),var(--gold));color:#3a1a05;box-shadow:0 0 16px rgba(242,140,40,.95);animation:ring 1.8s ease-in-out infinite;transform-origin:50% 20%}
.bell.lit .bdg{display:block}
@keyframes ring{0%,55%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(9deg)}40%{transform:rotate(-6deg)}50%{transform:rotate(3deg)}}
.shb{flex:0 0 40px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(232,184,74,.4);background:rgba(0,0,0,.25);color:var(--gold);display:grid;place-items:center;cursor:pointer}
.shb .ic{width:20px;height:20px}
.shtitle{padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.3);color:var(--cream);font-weight:600;line-height:1.55;margin:6px 0;word-break:break-word}
.ib-tools{text-align:right;padding:0 4px 8px}
.ib-tools button{background:none;border:none;color:var(--gold);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;padding:4px}
.ibi{display:flex;align-items:center;gap:10px;padding:12px 10px;margin-bottom:8px;border-radius:14px;border:1px solid rgba(232,184,74,.18);background:rgba(0,0,0,.2)}
.ibi.new{border-color:var(--saffron);background:rgba(242,140,40,.12);box-shadow:0 0 12px rgba(242,140,40,.25)}
.ibm{flex:1;min-width:0}
.ibf{font-size:.8rem;color:var(--muted);word-break:break-all;line-height:1.5}
.ibt{font-weight:600;line-height:1.5;word-break:break-word}
.ibd{font-size:.72rem;color:var(--muted)}
.nw{color:var(--saffron);font-weight:700;font-size:.7rem}
.ibp{flex:0 0 46px;width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--saffron),var(--gold));color:#3a1a05;display:grid;place-items:center;cursor:pointer}
/* Timer */
.sp-status{text-align:center;color:var(--gold);padding:6px 0 12px;font-weight:600}
.sp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sp-grid button{padding:14px 8px;min-height:50px;border-radius:14px;border:1px solid rgba(232,184,74,.45);background:rgba(0,0,0,.25);color:var(--cream);font:inherit;cursor:pointer}
.sp-grid button:active{background:rgba(232,184,74,.25)}
.sp-custom{display:flex;gap:8px;margin-top:12px}
.sp-custom input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid rgba(232,184,74,.4);background:rgba(0,0,0,.35);color:var(--cream);font:inherit;font-size:16px;outline:none}
.sp-custom button{padding:0 20px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--saffron),var(--gold));color:#3a1a05;font:inherit;font-weight:700;cursor:pointer}
.sp-off{width:100%;margin-top:12px;padding:12px;border-radius:14px;border:1px solid #8e2a1e;background:transparent;color:#ffb089;font:inherit;cursor:pointer}

@media (min-width:700px){.hero h1{font-size:1.9rem}.wheel{width:80px;height:80px}.container{padding:0 16px}.mname{font-size:.95rem}.mtitle{font-size:.8rem}.monks{gap:14px}.mhead .photo{width:96px;flex-basis:96px}.sheet{max-width:560px;margin-left:auto;margin-right:auto;width:100%}}
</style>
</head>
<body>

<!-- Icons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://rxyxaibfsymunsnomapj.supabase.co";
const SUPABASE_KEY = "sb_publishable_wPC6Nu102HghI1CPqzixPQ_LhjCv8Nw";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = t => { if (!isFinite(t)) return "0:00"; return Math.floor(t/60) + ":" + String(Math.floor(t%60)).padStart(2,"0"); };
const setIcon = (btn, id) => btn.querySelector("use").setAttribute("href", "#i-" + id);
const audio = $("audio");

let sermons = [], monks = [], view = [], queue = [], qi = -1, nowPlaying = null;
let cat = "all", curMonk = null, navigated = false;
let expanded = false, repMode = "auto", shuffleOn = false, speedIdx = 1, sleepEnd = null, sleepEOT = false, sleepTick = null;
const SPEEDS = [0.75, 1, 1.25, 1.5, 2];
const OTHER = "other";

/* ---------- Data ---------- */
async function load() {
  const [s, m] = await Promise.all([
    db.from("sermons").select("*").order("created_at", { ascending: false }),
    db.from("monks").select("*").order("sort_order").order("id")
  ]);
  if (s.error) { $("monks").innerHTML = `<div class="empty" style="grid-column:1/-1">ဒေတာ ဖတ်မရပါ: ${esc(s.error.message)}</div>`; return; }
  sermons = s.data || [];
  updateBell();
  monks = m.error ? [] : (m.data || []);
  renderMonks();
  route();
}

/* ---------- Home: ဆရာတော် Grid ---------- */
function photoHtml(url) {
  return url ? `<img src="${esc(url)}" alt="" loading="lazy" onerror="this.parentNode.textContent='☸'">` : "☸";
}
function renderMonks() {
  const hasOther = sermons.some(x => !x.monk_id || !monks.some(m => m.id === x.monk_id));
  const cards = monks.map(m => {
    const n = sermons.filter(x => x.monk_id === m.id).length;
    return `<div class="monk" data-id="${m.id}">
      <div class="photo">${photoHtml(m.photo_url)}</div>
      <div class="mname">${esc(m.name)}</div>
      ${m.title ? `<div class="mtitle">${esc(m.title)}</div>` : ""}
      <span class="mcount">${n} ပုဒ်</span></div>`;
  });
  if (hasOther) {
    const n = sermons.filter(x => !x.monk_id || !monks.some(m => m.id === x.monk_id)).length;
    cards.push(`<div class="monk" data-id="${OTHER}"><div class="photo">☸</div>
      <div class="mname">${monks.length ? "အခြားတရားများ" : "တရားတော်များ"}</div><span class="mcount">${n} ပုဒ်</span></div>`);
  }
  if (!cards.length) { $("monks").innerHTML = `<div class="empty" style="grid-column:1/-1">ဆရာတော် မရှိသေးပါ</div>`; return; }
  $("monks").innerHTML = cards.join("");
  document.querySelectorAll(".monk").forEach(el => el.onclick = () => {
    navigated = true; location.hash = "m=" + el.dataset.id;
  });
}

/* ---------- Routing ---------- */
function route() {
  const h = location.hash.replace("#", "");
  const id = h.startsWith("m=") ? h.slice(2) : null;
  if (!id || (id !== OTHER && !monks.some(m => m.id === +id))) {
    curMonk = null;
    $("homeView").hidden = false; $("monkView").hidden = true;
    return;
  }
  curMonk = id === OTHER ? OTHER : +id;
  cat = "all"; $("search").value = "";
  const m = monks.find(x => x.id === curMonk);
  $("mhead").innerHTML = m
    ? `<div class="photo">${photoHtml(m.photo_url)}</div><div><div class="mn">${esc(m.name)}</div>${m.title ? `<div class="mt">${esc(m.title)}</div>` : ""}</div>`
    : `<div class="photo">☸</div><div><div class="mn">${monks.length ? "အခြားတရားများ" : "တရားတော်များ"}</div></div>`;
  $("homeView").hidden = true; $("monkView").hidden = false;
  window.scrollTo(0, 0);
  renderChips(); applyFilter();
}
window.addEventListener("hashchange", route);
$("backBtn").onclick = () => { navigated ? history.back() : (location.hash = ""); };

/* ---------- တရားစာရင်း ---------- */
function monkSermons() {
  if (curMonk === null) return [];
  if (curMonk === OTHER) return sermons.filter(x => !x.monk_id || !monks.some(m => m.id === x.monk_id));
  return sermons.filter(x => x.monk_id === curMonk);
}
function renderChips() {
  const cats = [...new Set(monkSermons().map(s => s.category).filter(Boolean))];
  $("chips").style.display = cats.length ? "flex" : "none";
  $("chips").innerHTML = ["all", ...cats].map(c =>
    `<button class="chip ${c === cat ? "active" : ""}" data-c="${esc(c)}">${c === "all" ? "အားလုံး" : esc(c)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { cat = b.dataset.c; renderChips(); applyFilter(); });
}
function applyFilter() {
  const q = $("search").value.trim().toLowerCase();
  view = monkSermons().filter(s => (cat === "all" || s.category === cat) && (!q || s.title.toLowerCase().includes(q)));
  renderList();
}
function renderList() {
  if (!view.length) { $("list").innerHTML = `<div class="empty">တရားတော် မတွေ့ပါ</div>`; return; }
  $("list").innerHTML = view.map((s, i) => {
    const on = nowPlaying && nowPlaying.id === s.id;
    return `<div class="item ${on ? "playing" : ""}" data-i="${i}">
      <div class="num">${on ? (audio.paused ? "❚❚" : "♪") : i + 1}</div>
      <div class="info"><div class="t">${esc(s.title)}</div></div>
      ${s.category ? `<span class="tag">${esc(s.category)}</span>` : ""}
      <button class="shb" data-sh="${i}" aria-label="Share"><svg class="ic"><use href="#i-share"/></svg></button>
    </div>`;
  }).join("");
  document.querySelectorAll(".item").forEach(el => el.onclick = () => clickItem(+el.dataset.i));
  document.querySelectorAll(".shb").forEach(b => b.onclick = e => { e.stopPropagation(); openShare(view[+b.dataset.sh]); });
}

/* ---------- Player ---------- */
function sync() {
  $("fp").classList.toggle("show", expanded);
  const miniOn = !!nowPlaying && !expanded;
  $("mini").classList.toggle("show", miniOn);
  document.body.classList.toggle("has-player", miniOn);
  document.body.style.overflow = expanded ? "hidden" : "";
}
function expand() {
  if (!nowPlaying) return;
  if (!expanded) { expanded = true; history.pushState({ p: 1 }, ""); }
  sync();
}
function collapseUI() { expanded = false; sync(); }
function collapse() { (history.state && history.state.p) ? history.back() : collapseUI(); }
window.addEventListener("popstate", () => { if (expanded) collapseUI(); });

function hint(txt) {
  const h = $("hint"); h.textContent = txt; h.classList.add("show");
  clearTimeout(hint.t); hint.t = setTimeout(() => h.classList.remove("show"), 1600);
}
function clickItem(i) {
  const s = view[i];
  if (nowPlaying && nowPlaying.id === s.id) { expand(); if (audio.paused) audio.play(); return; }
  queue = view.slice(); qi = i; start(true);
}
function start(fromClick) {
  const s = queue[qi];
  if (!s) return;
  nowPlaying = s;
  audio.src = s.url;
  audio.playbackRate = SPEEDS[speedIdx];
  audio.play().catch(() => {});
  const monk = monks.find(m => m.id === s.monk_id);
  const who = monk ? monk.name : (s.speaker || "");
  $("ttl").textContent = s.title; $("spk").textContent = who || " ";
  $("miniA").textContent = s.title; $("miniB").textContent = who || " ";
  const art = monk ? photoHtml(monk.photo_url) : "☸";
  $("artCircle").innerHTML = art; $("miniTh").innerHTML = art;
  $("seek").value = 0; $("seek").style.setProperty("--p", "0%");
  $("cur").textContent = "0:00"; $("dur").textContent = "0:00"; $("miniProg").style.width = "0";
  document.title = "▶ " + s.title;
  if (fromClick) expand(); else sync();
  setMediaSession(s, who, monk);
  renderList(); renderQueue();
}
function step(d) {
  if (!queue.length) return;
  let n;
  if (d > 0 && shuffleOn && queue.length > 1) { do { n = Math.floor(Math.random() * queue.length); } while (n === qi); }
  else n = qi + d;
  if (n >= 0 && n < queue.length) { qi = n; start(false); }
}
function toggle() { audio.paused ? audio.play() : audio.pause(); }
function stopAll() {
  clearSleep();
  audio.pause(); audio.removeAttribute("src"); audio.load();
  nowPlaying = null; queue = []; qi = -1;

}

/* ---------- Notification (Media Session) ---------- */
function absUrl(u) { try { return new URL(u, location.href).href; } catch (e) { return ""; } }
function setMediaSession(s, who, monk) {
  if (!("mediaSession" in navigator)) return;
  const art = monk && monk.photo_url ? [96, 192, 256, 512].map(z => ({ src: absUrl(monk.photo_url), sizes: z + "x" + z })) : [];
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: who || "တရားတော်", album: s.category || "တရားတော်", artwork: art });
  } catch (e) {}
}
function setPlayState(st) { if ("mediaSession" in navigator) { try { navigator.mediaSession.playbackState = st; } catch (e) {} } }
let lastPos = 0;
function updatePos() {
  if (!("mediaSession" in navigator) || !audio.duration || !isFinite(audio.duration)) return;
  const now = Date.now(); if (now - lastPos < 1000) return; lastPos = now;
  try { navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: Math.min(audio.currentTime, audio.duration) }); } catch (e) {}
}
if ("mediaSession" in navigator) {
  const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
  set("play", () => audio.play());
  set("pause", () => audio.pause());
  set("previoustrack", () => step(-1));
  set("nexttrack", () => step(1));
  set("seekbackward", d => { audio.currentTime = Math.max(0, audio.currentTime - ((d && d.seekOffset) || 15)); });
  set("seekforward", d => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + ((d && d.seekOffset) || 15)); });
  set("seekto", d => { audio.currentTime = d.seekTime; });
  set("stop", () => stopAll());
}

/* ---------- Sleep Timer ---------- */
const SLEEP_OPTS = [[15, "15 မိနစ်"], [30, "30 မိနစ်"], [45, "45 မိနစ်"], [60, "1 နာရီ"], [90, "1 နာရီခွဲ"], [120, "2 နာရီ"], [180, "3 နာရီ"], ["eot", "ဒီတရားပြီးရင်"]];
function fmtLeft(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
}
function updateSleepUI() {
  let badge = "";
  if (sleepEOT) badge = "1ပုဒ်";
  else if (sleepEnd) {
    const mins = Math.ceil((sleepEnd - Date.now()) / 60000);
    badge = mins < 60 ? mins + "m" : (mins / 60).toFixed(1).replace(/\.0$/, "") + "h";
  }
  $("sleepBadge").textContent = badge;
  $("tSleep").classList.toggle("on", !!(sleepEnd || sleepEOT));
  $("spStatus").textContent = sleepEnd ? "⏳ ကျန်ချိန် " + fmtLeft(sleepEnd - Date.now())
    : sleepEOT ? "ဒီတရားပြီးရင် ရပ်မည်" : "Timer မသတ်မှတ်ရသေးပါ";
}
function clearSleep() {
  sleepEnd = null; sleepEOT = false;
  clearInterval(sleepTick); sleepTick = null;
  updateSleepUI();
}
function endSleep() {
  clearSleep();
  let v = 1;
  const f = setInterval(() => {
    v -= 0.1;
    if (v <= 0) { clearInterval(f); audio.pause(); audio.volume = 1; } else audio.volume = Math.max(0, v);
  }, 250);
  setTimeout(() => { clearInterval(f); audio.pause(); audio.volume = 1; }, 5000);
  hint("Timer ပြည့်ပြီ — ရပ်လိုက်ပါပြီ 🙏");
}
function checkSleep() { if (sleepEnd && Date.now() >= sleepEnd) endSleep(); }
function setSleep(v) {
  clearSleep();
  if (v === "eot") { sleepEOT = true; hint("ဒီတရားပြီးရင် ရပ်မည်"); }
  else {
    sleepEnd = Date.now() + v * 60000;
    sleepTick = setInterval(() => { checkSleep(); updateSleepUI(); }, 1000);
    hint(v >= 60 ? `${v / 60} နာရီအကြာမှာ အလိုအလျောက် ပိတ်မည်` : `${v} မိနစ်အကြာမှာ အလိုအလျောက် ပိတ်မည်`);
  }
  updateSleepUI();
}
function openSleep() {
  $("spGrid").innerHTML = SLEEP_OPTS.map(([v, l]) => `<button data-v="${v}">${l}</button>`).join("");
  document.querySelectorAll("#spGrid button").forEach(b => b.onclick = () => {
    setSleep(b.dataset.v === "eot" ? "eot" : +b.dataset.v); $("sp").classList.remove("show");
  });
  updateSleepUI(); $("sp").classList.add("show");
}
$("spClose").onclick = () => $("sp").classList.remove("show");
$("sp").onclick = e => { if (e.target.id === "sp") $("sp").classList.remove("show"); };
$("spSet").onclick = () => {
  const v = parseInt($("spMin").value, 10);
  if (!v || v < 1 || v > 1440) return toast("မိနစ် 1 ကနေ 1440 ကြား ထည့်ပါ");
  setSleep(v); $("spMin").value = ""; $("sp").classList.remove("show");
};
$("spOff").onclick = () => { clearSleep(); hint("Timer ပိတ်လိုက်ပါပြီ"); $("sp").classList.remove("show"); };
setInterval(() => { if ($("sp").classList.contains("show")) updateSleepUI(); }, 1000);

/* ---------- Email Login / Register (Supabase Auth) ---------- */
let user = null, authMode = "login";
function toast(t) {
  const e = $("toast"); e.textContent = t; e.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 2800);
}
const homeUrl = () => location.href.split("#")[0].split("?")[0];
function authMsg(e) {
  const m = ((e && e.message) || "").toLowerCase();
  if (m.includes("invalid login")) return "Email သို့မဟုတ် Password မှားနေပါတယ်";
  if (m.includes("already registered") || m.includes("already been registered")) return "ဒီ Email နဲ့ အကောင့်ရှိပြီးသားပါ";
  if (m.includes("not confirmed")) return "Email ကို အတည်ပြုရသေးပါ၊ Inbox/Spam ထဲက Link ကိုနှိပ်ပါ";
  if (m.includes("rate limit") || m.includes("too many") || m.includes("security purposes")) return "ခဏအကြာမှ ပြန်စမ်းပါ (Email ပို့တာ ကန့်သတ်ချက် ပြည့်နေပါတယ်)";
  if (m.includes("valid email") || m.includes("invalid email")) return "Email ပုံစံ မမှန်ပါ";
  if (m.includes("signups not allowed") || m.includes("provider is disabled")) return "Supabase မှာ Email Login ကို မဖွင့်ရသေးပါ";
  if (m.includes("password")) return "Password အနည်းဆုံး 6 လုံး ရှိရမယ်";
  return (e && e.message) || "Error ဖြစ်သွားပါတယ်";
}
function updateAcct() {
  $("acctBtn").textContent = user ? ((user.email || "?")[0] || "?").toUpperCase() : "👤";
  $("acctBtn").classList.toggle("in", !!user);
}
function openAuth(m) { authMode = m || (user ? "account" : "login"); renderAuth(); $("ac").classList.add("show"); }
function closeAuth() { $("ac").classList.remove("show"); }
function renderAuth() {
  const head = t => `<div class="ach"><span>${t}</span><button class="round" id="acX" style="width:38px;height:38px" type="button" aria-label="ပိတ်"><svg class="ic"><use href="#i-close"/></svg></button></div>`;

  } else if (authMode === "register") {

      <label>Email</label><input type="email" id="aEmail" autocomplete="email" required placeholder="example@gmail.com">

      <label>Password ထပ်ရိုက်ပါ</label><input type="password" id="aPw2" autocomplete="new-password" required>
      <div class="amsg" id="amsg"></div><button class="abtn" id="aBtn" type="submit">အကောင့်ဖောက်မည်</button></form>

      <label>မှတ်ပုံတင်ထားတဲ့ Email</label><input type="email" id="aEmail" autocomplete="email" required placeholder="example@gmail.com">

  } else if (authMode === "reset") {
    h = head("🔑 Password အသစ်ပြောင်းရန်") + `<form id="acForm">
      <label>Password အသစ် (အနည်းဆုံး 6 လုံး)</label><input type="password" id="aPw" autocomplete="new-password" required>
      <div class="amsg" id="amsg"></div><button class="abtn" id="aBtn" type="submit">သိမ်းမည်</button></form>`;
  } else {
    h = head("🙏 အကောင့်ဝင်ရန်") + `<form id="acForm">
      <label>Email</label><input type="email" id="aEmail" autocomplete="email" required placeholder="example@gmail.com">
      <label>Password</label><input type="password" id="aPw" autocomplete="current-password" required>

      <div class="alinks"><button data-go="register" type="button">အကောင့်အသစ် ဖောက်မည်</button><button data-go="forgot" type="button">Password မေ့နေလား?</button></div>`;
  }
  $("acBox").innerHTML = h;
  $("acX").onclick = closeAuth;
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { authMode = b.dataset.go; renderAuth(); });
  if ($("acOut")) $("acOut").onclick = async () => { await db.auth.signOut(); closeAuth(); toast("ထွက်ပြီးပါပြီ"); };
  if ($("acForm")) $("acForm").onsubmit = e => { e.preventDefault(); submitAuth(); };
}
async function submitAuth() {
  const em = $("aEmail") ? $("aEmail").value.trim() : "", pw = $("aPw") ? $("aPw").value : "", pw2 = $("aPw2") ? $("aPw2").value : "";
  const msg = (t, ok) => { $("amsg").textContent = t; $("amsg").classList.toggle("ok", !!ok); };
  const btn = $("aBtn"); btn.disabled = true; msg("");
  try {
    if (authMode === "login") {
      const { error } = await db.auth.signInWithPassword({ email: em, password: pw });
      if (error) return msg(authMsg(error));
      closeAuth(); toast("ဝင်ပြီးပါပြီ 🙏");
    } else if (authMode === "register") {
      if (pw.length < 6) return msg("Password အနည်းဆုံး 6 လုံး ရှိရမယ်");
      if (pw !== pw2) return msg("Password နှစ်ခု မတူပါ");
      const { data, error } = await db.auth.signUp({ email: em, password: pw, options: { emailRedirectTo: homeUrl() } });
      if (error) return msg(authMsg(error));
      if (data.user && data.user.identities && data.user.identities.length === 0) return msg("ဒီ Email နဲ့ အကောင့်ရှိပြီးသားပါ");
      if (data.session) { closeAuth(); toast("အကောင့်ဖောက်ပြီးပါပြီ 🙏"); }
      else msg("✅ " + em + " သို့ အတည်ပြုရန် Email ပို့လိုက်ပါပြီ။ Inbox/Spam ထဲက Link ကို နှိပ်ပါ။", true);
    } else if (authMode === "forgot") {
      const { error } = await db.auth.resetPasswordForEmail(em, { redirectTo: homeUrl() });
      if (error) return msg(authMsg(error));
      msg("✅ Password ပြောင်းရန် Link ကို Email သို့ ပို့လိုက်ပါပြီ။", true);
    } else if (authMode === "reset") {
      if (pw.length < 6) return msg("Password အနည်းဆုံး 6 လုံး ရှိရမယ်");
      const { error } = await db.auth.updateUser({ password: pw });
      if (error) return msg(authMsg(error));
      closeAuth(); toast("Password ပြောင်းပြီးပါပြီ ✔");
    }
  } finally { btn.disabled = false; }
}
$("acctBtn").onclick = () => openAuth();

async function initAuth() {
  try {
    const { data } = await db.auth.getSession();
    user = (data.session && data.session.user) || null; updateAcct(); onUser();
    db.auth.onAuthStateChange((ev, session) => {
      user = (session && session.user) || null; updateAcct(); setTimeout(onUser, 0);
      if (ev === "PASSWORD_RECOVERY") { authMode = "reset"; renderAuth(); $("ac").classList.add("show"); }
    });
  } catch (e) {}
}

/* ---------- Share (User အချင်းချင်း) + 🔔 ---------- */
let shares = [], shareCh = null, shareFor = null;
const myEmail = () => ((user && user.email) || "").toLowerCase();
const sermonById = id => sermons.find(s => s.id === id);
function ago(t) {
  const m = Math.floor((Date.now() - new Date(t)) / 60000);
  if (m < 1) return "ခုနကပဲ";
  if (m < 60) return m + " မိနစ်ခန့်က";
  const h = Math.floor(m / 60);
  return h < 24 ? h + " နာရီခန့်က" : Math.floor(h / 24) + " ရက်ခန့်က";
}
function unseenCount() { return shares.filter(r => !r.seen && sermonById(r.sermon_id)).length; }
function updateBell() {
  $("bell").hidden = !user;
  const n = unseenCount();
  $("bell").classList.toggle("lit", n > 0);
  $("bdg").textContent = n > 99 ? "99+" : n;
}
async function loadShares() {
  if (!user) { shares = []; updateBell(); return; }
  const { data, error } = await db.from("shares").select("*").eq("to_email", myEmail()).order("created_at", { ascending: false }).limit(100);
  if (!error) shares = data || [];
  updateBell();
  if ($("ib").classList.contains("show")) renderInbox();
}
function subscribeShares() {
  if (!user) { if (shareCh) { db.removeChannel(shareCh); shareCh = null; shareFor = null; } return; }
  if (shareFor === user.id) return;
  if (shareCh) db.removeChannel(shareCh);
  shareFor = user.id;
  shareCh = db.channel("shares-" + user.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "shares" }, p => {
      const r = p.new;
      if (!r || (r.to_email || "").toLowerCase() !== myEmail()) return;
      loadShares().then(() => {
        const sm = sermonById(r.sermon_id);
        toast("🔔 " + r.from_email + " က " + (sm ? "“" + sm.title + "” " : "တရား ") + "ပို့လိုက်ပါတယ်");
        if (navigator.vibrate) navigator.vibrate(200);
      });
    }).subscribe();
}
function onUser() {
  updateBell();
  if (user) { loadShares(); subscribeShares(); }
  else { shares = []; subscribeShares(); updateBell(); }
}
setInterval(() => { if (user && !document.hidden) loadShares(); }, 45000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && user) loadShares(); });

/* Inbox */

      <div class="ibt">${esc(sm.title)}</div><div class="ibd">${ago(r.created_at)}</div></div>
      <button class="ibp" data-id="${r.id}" aria-label="ဖွင့်မည်"><svg class="ic"><use href="#i-play"/></svg></button></div>`;
  }).join("") : `<div class="empty">ပို့ထားတဲ့ တရား မရှိသေးပါ</div>`;

async function getIce(turn) {

}

  track.addEventListener("scroll", () => {
    slideCur = Math.round(track.scrollLeft / track.clientWidth);
    document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("on", i === slideCur));
  }, { passive: true });
  const hold = () => { slidePause = true; clearTimeout(hold.t); hold.t = setTimeout(() => slidePause = false, 6000); };
  track.addEventListener("touchstart", hold, { passive: true });
  track.addEventListener("pointerdown", hold);
  if (slideCount > 1) setInterval(() => {
    if (slidePause || document.hidden || $("homeView").hidden) return;
    track.scrollTo({ left: ((slideCur + 1) % slideCount) * track.clientWidth, behavior: "smooth" });
  }, 4000);
}

load();
loadSlides();
initAuth();
</script>
</body>
</html>
